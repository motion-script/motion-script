# Release workflow driven by Changesets.
#
# Triggered by CI (workflow_run) finishing successfully on `main`, rather than
# on `push` directly — CI already installs, builds, and tests this exact SHA,
# so re-running all of that here would just duplicate that work on every push.
# This workflow only needs to run once CI has confirmed the commit is green:
#   - If there are unreleased changesets, the changesets/action opens (or updates)
#     a "Version Packages" PR. That PR runs `pnpm version-packages`, which bumps
#     versions, syncs the root version, and updates the lockfile.
#   - When that PR is merged (and CI passes on it), this workflow runs again,
#     finds the bumped versions, and runs `pnpm release` (build:lib + changeset
#     publish) to publish to npm.
#
# Publishing uses npm OIDC Trusted Publishing (provenance), so no NPM_TOKEN is
# required. Each @motion-script/* package must have a Trusted Publisher configured
# on npmjs.com pointing at this repo + this workflow file.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # enables the manual "Run workflow" button

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only run for a CI run that actually passed; skip on CI failure. The
    # `workflow_dispatch` path has no workflow_run event, so let that through too.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the Version Packages PR / push tags
      pull-requests: write   # open and update the Version Packages PR
      id-token: write        # request the OIDC token from npm for provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      # OIDC Trusted Publishing requires npm CLI >= 11.5.1. `changeset publish`
      # shells out to whatever `npm` is on PATH, so pin a recent one explicitly.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build is still needed here: `changeset publish` (via `pnpm release`)
      # publishes the built `dist/` output, and this job's checkout doesn't
      # share filesystem state with the CI run that already built + tested it.
      - name: Build libraries
        run: pnpm build:lib

      - name: Create Release PR or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          # All packages are version-locked (see .changeset/config.json `linked`),
          # so `changeset publish` emits 10 per-package tags and the action would
          # otherwise create 10 near-identical GitHub Releases. Disable that and
          # cut a single consolidated `v<version>` release in the next step.
          createGithubReleases: false
          commit: "ci: release packages"
          title: "ci: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm authenticates via OIDC (the id-token permission above), so no
          # NPM_TOKEN is needed. This env var makes `changeset publish` attach
          # provenance without having to pass --provenance in the release script.
          NPM_CONFIG_PROVENANCE: "true"

      # Cut ONE GitHub Release per version instead of one per package. Because the
      # packages are linked, they all share a version and an identical changelog
      # entry, so core's CHANGELOG is the release notes for the whole set. Runs
      # only on the publish leg (when `changeset publish` actually released).
      - name: Create consolidated GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          # Grab the top `## <version>` block from core's changelog (from the
          # first `## ` heading up to, but not including, the next one).
          NOTES=$(awk '/^## /{if(p)exit; p=1} p' packages/core/CHANGELOG.md)
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$NOTES"
