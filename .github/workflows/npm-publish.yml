# This workflow runs tests using node and then publishes a package to npm via OIDC Trusted Publishing
name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch: # <--- Added this to enable the manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Crucial: Allows GitHub to request the OIDC token from npm
      contents: read  # Crucial: Allows actions/checkout to read your repository code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish --provenance # Crucial: Generates a publicly verifiable supply chain build record
