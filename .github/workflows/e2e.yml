# Opt-in end-to-end test of the PUBLISHED tarballs.
#
# Deliberately separate from the release workflow (npm-publish.yml): it points
# npm/pnpm at a throwaway local Verdaccio registry, so it must never run in the
# same job as the real OIDC publish. It is also not part of `pnpm test`
# (`pnpm -r test`) — the package script is `test:e2e`, not `test`.
#
# Trigger: nightly, or manually via the "Run workflow" button.
name: E2E (published tarballs)

on:
  schedule:
    - cron: "0 6 * * *" # nightly 06:00 UTC
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The render is driven by @motion-script/cli's Playwright. Install the
      # browser (and its Linux system deps) before the e2e renders a scene.
      - name: Install Playwright Chromium
        run: pnpm --filter @motion-script/cli exec playwright install --with-deps chromium

      # build:lib runs inside run.mjs, so local and CI behave identically.
      # SwiftShader is forced because GitHub runners have no usable GPU.
      - name: Run e2e
        run: pnpm test:e2e
        env:
          MS_SOFTWARE_RENDER: "1"
          CI: "true"
